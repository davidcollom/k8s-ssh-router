name: Go

on:
  push:
    # golang is the default branch of this repository; main is the legacy
    # branch it was renamed from and is only kept for reference.
    branches: [ golang, main, release/**, feature/** ]
  pull_request:
    branches: [ golang, main, release/**, feature/** ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The image is published to ghcr.io, which needs the package write
      # scope. Without it the push is denied with "installation not allowed
      # to Create organization package".
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test ./... -v

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}

    # docker/metadata-action uses the "latest=auto" flavor, so a push to the
    # default branch (golang) publishes the "latest" tag as well.
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
